[project]
name = "web-chat"
version = "0.1.0"
description = ""
authors = [
    { name = "John Preston", email = "john@preston.com" },
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.1,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "bcrypt>=5.0.0,<6.0.0",
    "fastapi>=0.128.0,<0.129.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pyjwt[crypto]>=2.11.0,<3.0.0",
    "python-multipart>=0.0.22,<0.0.23",
    "sqlalchemy>=2.0.46,<3.0.0",
    "uvicorn[standard]>=0.41.0,<0.42.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.4.1,<2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
testcontainers = "^4.14.2"
httpx = "^0.28.1"
ruff = "^0.15.21"
mypy = "^2.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.4.1,<2.5.0"]
build-backend = "poetry.core.masonry.api"
