services:
  web-chat:
    container_name: web-chat
    restart: always
    build: ./src
    working_dir: /usr/web-chat/src
    command: sh -c "
      poetry run alembic upgrade head &&
      poetry run python main.py
      "
    env_file: ./src/core/envs/.env
    networks:
      - web-chat-network
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./src/core/certs:/usr/web-chat/src/core/certs
    depends_on:
      web-chat-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$${SERVER_PORT:-8000}/api/healthcheck', timeout=3)\""]
      interval: 60s
      timeout: 3s
      retries: 3

  web-chat-db:
    image: postgres:16-alpine
    container_name: web-chat-db
    restart: always
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-db_name}
    networks:
      - web-chat-network
    expose:
      - "${POSTGRES_PORT:-5432}"
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - web-chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USER:-db_user} -d $${POSTGRES_DB:-db_name}"]
      interval: 60s
      timeout: 3s
      retries: 3

volumes:
  web-chat-db-data:

networks:
  web-chat-network:
    name: web-chat-network
    external: false
